<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="A gas cylinder being delivered to a home">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <circle cx="320" cy="330" r="290" fill="url(#bg)"/>

  <!-- dashed delivery route -->
  <path d="M150 500 C 210 440, 230 360, 300 300 S 460 250, 520 190" fill="none" stroke="#fdba74" stroke-width="8" stroke-dasharray="4 18" stroke-linecap="round"/>

  <!-- house (destination) -->
  <g transform="translate(478 120)">
    <rect x="0" y="34" width="84" height="58" rx="4" fill="#fed7aa"/>
    <path d="M-6 36 L42 4 L90 36 Z" fill="#9a3412"/>
    <rect x="30" y="52" width="24" height="40" rx="3" fill="#c2410c"/>
  </g>

  <!-- delivery truck -->
  <g transform="translate(76 380)">
    <rect x="0" y="16" width="70" height="52" rx="6" fill="#f97316"/>
    <rect x="70" y="26" width="60" height="42" rx="4" fill="#ea580c"/>
    <path d="M130 26 l26 0 0 42 -26 0 Z" fill="#fdba74"/>
    <circle cx="30" cy="84" r="14" fill="#1e293b"/>
    <circle cx="112" cy="84" r="14" fill="#1e293b"/>
    <circle cx="30" cy="84" r="5" fill="#64748b"/>
    <circle cx="112" cy="84" r="5" fill="#64748b"/>
  </g>

  <!-- gas cylinder -->
  <g transform="translate(230 180)">
    <path d="M40 76 C40 48 68 34 90 34 C112 34 140 48 140 76 Z" fill="#fdba74"/>
    <rect x="40" y="74" width="100" height="168" rx="18" fill="url(#cyl)"/>
    <rect x="58" y="92" width="12" height="132" rx="6" fill="#ffffff" opacity="0.28"/>
    <path d="M84 16 h12 v18 h-12 Z" fill="#9a3412"/>
    <rect x="76" y="34" width="28" height="8" rx="4" fill="#7c2d12"/>
    <rect x="30" y="238" width="120" height="14" rx="7" fill="#9a3412"/>
    <!-- flame badge -->
    <circle cx="90" cy="150" r="42" fill="#ffffff" opacity="0.94"/>
    <path d="M90 124 c8 12 16 20 16 26 a16 16 0 0 1 -32 0 c0 -6 8 -14 16 -26 Z" fill="#f97316"/>
    <path d="M90 134 c4 6 8 10 8 13 a8 8 0 0 1 -16 0 c0 -3 4 -7 8 -13 Z" fill="#fb923c"/>
  </g>

  <!-- sparkles -->
  <path d="M120 150 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#fbbf24"/>
  <path d="M540 300 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" fill="#fbbf24"/>
  <path d="M420 96 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="#fdba74"/>
</svg>